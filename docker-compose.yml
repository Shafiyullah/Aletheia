version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: aletheia_user
      POSTGRES_PASSWORD: aletheia_password
      POSTGRES_DB: aletheia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://aletheia_user:aletheia_password@postgres:5432/aletheia_db
      - REDIS_URL=redis://redis:6379/0
      - ALETHEIA_SECRET_KEY=${ALETHEIA_SECRET_KEY:-b3c9f28a7d189e4c5b3648f5a2b19e26d9c87f3e1b7d5a5cf2b3e4f8d9b1a2c3}
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: celery -A core.worker worker --loglevel=info
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://aletheia_user:aletheia_password@postgres:5432/aletheia_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"

volumes:
  postgres_data:
